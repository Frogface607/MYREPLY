<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyReply</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="6" fill="#6366f1"/>
          <path d="M12 6L14.5 11L20 12L16 16L17 22L12 19L7 22L8 16L4 12L9.5 11L12 6Z" fill="white"/>
        </svg>
        <span>MyReply</span>
      </div>
      <div id="usage-counter" class="usage-counter hidden">
        <span id="usage-text">0/10</span>
      </div>
    </header>

    <div id="auth-section" class="section auth-section">
      <p>Войдите, чтобы отвечать на отзывы с учетом профиля вашего бизнеса, а не generic-шаблоном маркетплейса.</p>
      <a href="https://myreply.vercel.app/auth" target="_blank" class="btn btn-primary">
        Войти в MyReply
      </a>
    </div>

    <div id="main-section" class="section hidden">
      <div id="business-status" class="business-status hidden">
        <span class="status-dot"></span>
        <span id="business-status-text">Проверяем профиль бизнеса</span>
      </div>

      <div class="input-group">
        <label for="review-text">Текст отзыва</label>
        <textarea
          id="review-text"
          placeholder="Вставьте текст отзыва или нажмите кнопку MyReply рядом с отзывом на площадке"
          rows="4"
        ></textarea>
      </div>

      <div class="input-group">
        <label for="context">Контекст владельца или менеджера</label>
        <input
          type="text"
          id="context"
          placeholder="Например: клиент выбрал самовывоз, товар проверяли перед отправкой"
        >
      </div>

      <div class="mode-selector">
        <label>Режим ответа</label>
        <div class="modes">
          <button class="mode-btn active" data-mode="all">Все режимы</button>
          <button class="mode-btn" data-mode="neutral">Нейтральный</button>
          <button class="mode-btn" data-mode="empathetic">Эмпатичный</button>
          <button class="mode-btn" data-mode="solution">С решением</button>
          <button class="mode-btn" data-mode="passive">Холодный</button>
          <button class="mode-btn" data-mode="hardcore">Дерзкий</button>
        </div>
      </div>

      <button id="generate-btn" class="btn btn-primary btn-block">
        <span class="btn-text">Сгенерировать ответы</span>
        <span class="btn-loader hidden">
          <svg class="spinner" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="30 70"/>
          </svg>
        </span>
      </button>

      <div id="results" class="results hidden">
        <div id="responses-list" class="responses-list"></div>
      </div>
    </div>

    <div id="paywall-section" class="section paywall-section hidden">
      <div class="paywall-icon">!</div>
      <h3>Лимит исчерпан</h3>
      <p>Вы использовали все бесплатные ответы.</p>
      <a href="https://myreply.vercel.app/pricing" target="_blank" class="btn btn-primary">
        Выбрать тариф
      </a>
    </div>

    <footer class="footer">
      <a href="https://myreply.vercel.app" target="_blank">myreply.vercel.app</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
